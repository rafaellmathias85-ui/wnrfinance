# ============================
# WNR FINANCE - Docker Compose
# Deploy para VPS (Hostinger/qualquer VPS)
# ============================
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wnr_postgres
    restart: always
    environment:
      POSTGRES_DB: wnr_finance
      POSTGRES_USER: ${DB_USER:-wnr_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - wnr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wnr_user} -d wnr_finance"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wnr_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-wnr_user}:${DB_PASSWORD}@postgres:5432/wnr_finance?connect_timeout=15&connection_limit=10&pool_timeout=20
    ports:
      - "3000:3000"
    networks:
      - wnr_network

  nginx:
    image: nginx:alpine
    container_name: wnr_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - wnr_network

  certbot:
    image: certbot/certbot
    container_name: wnr_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  postgres_data:
  certbot_data:
  certbot_www:

networks:
  wnr_network:
    driver: bridge
