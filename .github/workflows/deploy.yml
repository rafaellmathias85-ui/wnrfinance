name: Deploy WNR Finance — VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-wnrfinance
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy (PM2)
    runs-on: self-hosted

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── 2. Sincronizar código para /var/www/wnrfinance ──────────────
      - name: Sincronizar código
        run: |
          echo "📂 Copiando arquivos atualizados para /var/www/wnrfinance..."
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='ecosystem.config.js' \
            --exclude='.git/' \
            --exclude='ITAU/' \
            --exclude='INTER/' \
            "$GITHUB_WORKSPACE/" /var/www/wnrfinance/
          echo "✅ Código sincronizado"

      # ─── 3. Instalar dependências ─────────────────────────────────────
      - name: Instalar dependências
        working-directory: /var/www/wnrfinance
        run: |
          echo "📦 Instalando dependências..."
          npm ci --legacy-peer-deps
          echo "✅ Dependências instaladas"

      # ─── 4. Gerar Prisma Client ───────────────────────────────────────
      - name: Gerar Prisma Client
        working-directory: /var/www/wnrfinance
        run: |
          echo "🔧 Gerando Prisma Client com tipos atualizados..."
          npx prisma generate
          echo "✅ Prisma Client gerado"

      # ─── 5. Build Next.js standalone ─────────────────────────────────
      - name: Build Next.js
        working-directory: /var/www/wnrfinance
        env:
          NODE_ENV: production
        run: |
          echo "🏗️  Buildando Next.js..."
          rm -rf .next
          npm run build
          echo "✅ Build concluído"

      # ─── 6. Copiar assets estáticos para o standalone ────────────────
      - name: Copiar assets estáticos
        working-directory: /var/www/wnrfinance
        run: |
          echo "📁 Copiando .next/static e public para standalone..."
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          echo "✅ Assets copiados"

      # ─── 7. Prisma Migrate Deploy ─────────────────────────────────────
      - name: Prisma Migrate Deploy
        working-directory: /var/www/wnrfinance
        run: |
          echo "🗄️  Aplicando migrations pendentes..."
          npx prisma migrate deploy
          echo "✅ Migrations aplicadas"

      # ─── 8. Reiniciar PM2 ────────────────────────────────────────────
      - name: Reiniciar PM2 (wnrfinance)
        working-directory: /var/www/wnrfinance
        run: |
          echo "🔄 Reiniciando PM2 wnrfinance..."
          pm2 reload ecosystem.config.js --update-env
          pm2 save
          echo "✅ PM2 reiniciado"

      # ─── 8. Health check ──────────────────────────────────────────────
      - name: Health check
        run: |
          echo "🔍 Aguardando aplicação iniciar..."
          sleep 8
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 http://localhost:3003/wnrfinance/app/login 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "307" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "401" ]; then
            echo "✅ Aplicação respondendo (HTTP $HTTP_STATUS)"
          else
            echo "⚠️  HTTP $HTTP_STATUS — verificando logs PM2..."
            pm2 logs wnrfinance --lines 20 --nostream
          fi

      # ─── 9. Resumo ────────────────────────────────────────────────────
      - name: Resumo do deploy
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════"
          echo " WNR Finance — Resumo do Deploy"
          echo "════════════════════════════════════"
          echo " Commit : ${{ github.sha }}"
          echo " Branch : ${{ github.ref_name }}"
          echo " Autor  : ${{ github.actor }}"
          echo " Data   : $(date '+%d/%m/%Y %H:%M:%S')"
          echo "════════════════════════════════════"
          pm2 list | grep wnrfinance
