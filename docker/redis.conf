# WNR Finance — Redis local (desenvolvimento)
requirepass wnr-redis-local-2026

# Limite de memória (rate limiting keys são pequenos, 128MB é suficiente)
maxmemory 268435456
maxmemory-policy allkeys-lru

# Desabilitar persistência em disco (dev — velocidade > durabilidade)
save ""
appendonly no

# Conexões
maxclients 100
timeout 300

# Logging
loglevel notice
